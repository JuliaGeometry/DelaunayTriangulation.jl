name: CI
on:
  push:
    branches:
      - main
      - overall-review # temporary, to test CI without a PR
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.tests.name }} - ${{ github.event_name }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - '1.11'
          - 'pre'
          - 'lts'
        # Windows and macOS are only tested on the latest release, which is enough to catch problems specific to an
        # operating system, e.g. with paths or with how figures are rendered. The architecture is the runner's own, so
        # macOS runs on Apple silicon.
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        exclude:
          - { version: '1.11', os: windows-latest }
          - { version: 'pre', os: windows-latest }
          - { version: 'lts', os: windows-latest }
          - { version: '1.11', os: macos-latest }
          - { version: 'pre', os: macos-latest }
          - { version: 'lts', os: macos-latest }
        # The test groups from test/runtests.jl, split into jobs that take roughly the same time. A group that is
        # not listed here is not run on CI, which the test-summary job checks. Groups with spaces in their names need quotes.
        tests:
          - name: 'Core and curves'
            groups: 'Aqua Primitives Predicates Utilities Geometry Trees Curves'
          - name: 'Triangulation'
            groups: 'Triangulation "Point Location" Statistics'
          - name: 'Refinement'
            groups: 'Refinement'
          - name: 'Curve-bounded domains'
            groups: '"Curve-bounded domains"'
          - name: 'Voronoi and docs'
            groups: 'Voronoi Makie "Docstring examples" "Run the documentation examples"'
    steps:
      - name: Checkout repository for access
        uses: actions/checkout@v7

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'

      - name: Cache artifacts, etc.
        uses: julia-actions/cache@v3

      - name: Build the package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: DelaunayTriangulation

      # Coverage is only collected on one version, since it makes the tests up to five times slower (most of all on Julia 1.13)
      - name: Run the tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: DelaunayTriangulation
          test_args: ${{ matrix.tests.groups }}
          coverage: ${{ matrix.version == 'lts' }}
        env:
          DT_TEST_REPORT: ${{ runner.temp }}/test_report.tsv

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.version }}-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test_report.tsv
          if-no-files-found: ignore
          retention-days: 7

      - name: Process the coverage
        if: ${{ always() && matrix.version == 'lts' }}
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: DelaunayTriangulation/src

      - name: Upload the results
        if: ${{ always() && matrix.version == 'lts' }}
        uses: codecov/codecov-action@v7
        with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: lcov.info
            fail_ci_if_error: false
  test-summary:
    name: Test summary
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for access
        uses: actions/checkout@v7

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Download the test reports
        uses: actions/download-artifact@v8
        with:
          pattern: test-report-*
          path: test_reports

      - name: Summarise the tests
        run: julia --color=yes .github/test_summary.jl test_reports
        env:
          TESTS_RESULT: ${{ needs.test.result }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # for julia-actions/cache to delete old caches
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: DelaunayTriangulation
      - run: julia --project=DelaunayTriangulation/docs --color=yes -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=DelaunayTriangulation/docs --color=yes DelaunayTriangulation/docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
